; php-fpm pool: listen on TCP 9000 so the nginx container can reach us
; over the docker network.
[www]
user  = www-data
group = www-data

listen = 9000

pm = dynamic
pm.max_children      = 5
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Keep environment variables (DOMAIN_NAME, MYSQL_*, ...) visible to PHP.
clear_env = no

; Sensible, container-friendly logging.
php_admin_value[error_log] = /tmp/php-fpm-error.log
php_admin_flag[log_errors]  = on
